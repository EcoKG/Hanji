name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }} / Java ${{ matrix.java }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: [17, 21]
    runs-on: ${{ matrix.os }}
    env:
      HANJI_REQUIRE_E2E: "1"   # browser tests must run here, never be skipped
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Cache Electron runtime
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hanji-cache
          key: electron-44.9.3-${{ runner.os }}-${{ runner.arch }}

      # Window managers handle maximize/minimize on X11; Xvfb has none
      - name: Install a window manager (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q openbox

      # Google Chrome is preinstalled on all GitHub-hosted runners; the E2E tests find it automatically.
      - name: Build and test (Linux, virtual display for the window tests)
        if: runner.os == 'Linux'
        env:
          HANJI_CACHE: ${{ runner.temp }}/hanji-cache   # downloaded Electron runtime (cached above)
        run: xvfb-run -a bash -c 'openbox & sleep 1; mvn -B -ntp install'

      - name: Build and test
        if: runner.os != 'Linux'
        env:
          HANJI_CACHE: ${{ runner.temp }}/hanji-cache
        run: mvn -B -ntp install

      - name: Test summary
        if: always()
        shell: bash
        run: |
          for f in */target/surefire-reports/TEST-*.xml; do
            [ -f "$f" ] || continue
            line=$(grep -o '<testsuite [^>]*>' "$f" | head -1)
            attr() { echo "$line" | sed -nE "s/.* $1=\"([^\"]*)\".*/\1/p"; }
            echo "::notice title=$(attr name)::tests=$(attr tests) failures=$(attr failures) errors=$(attr errors) skipped=$(attr skipped)"
            # one error annotation per failed test, with its message
            awk -v cls="$(attr name)" '
              /<testcase / { if (match($0, / name="[^"]*"/)) tc = substr($0, RSTART + 7, RLENGTH - 8) }
              /<(failure|error)[ >]/ { msg = ""; if (match($0, / message="[^"]*"/)) msg = substr($0, RSTART + 10, RLENGTH - 11); print "::error title=" cls "." tc "::" substr(msg, 1, 300) }
            ' "$f"
          done

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.os }}-java${{ matrix.java }}
          path: '**/target/surefire-reports/'
