name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }} / Java ${{ matrix.java }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: [17, 21]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # Google Chrome is preinstalled on all GitHub-hosted runners; the E2E tests find it automatically.
      - name: Build and test (Linux, virtual display for the app-window test)
        if: runner.os == 'Linux'
        run: xvfb-run -a mvn -B -ntp install

      - name: Build and test
        if: runner.os != 'Linux'
        run: mvn -B -ntp install

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.os }}-java${{ matrix.java }}
          path: '**/target/surefire-reports/'
